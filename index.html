<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Word Order Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1f2433;--muted:#8a90a5;--accent:#5b6cff;--ok:#2fb36d;--bad:#e5484d;--slot:#e9ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171923;--card:#242838;--text:#eef0f8;--muted:#8d93aa;--accent:#7b89ff;--slot:#2b3050}}
:root[data-theme="dark"]{--bg:#171923;--card:#242838;--text:#eef0f8;--muted:#8d93aa;--accent:#7b89ff;--slot:#2b3050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:0;background:var(--card);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.formula{font-size:13px;color:var(--muted);margin-bottom:14px}
.ru{font-size:17px;font-weight:600;margin:10px 0 14px}
.slots,.pool{display:flex;flex-wrap:wrap;gap:10px}
.slot{min-width:100px;min-height:52px;padding:8px 14px;border-radius:26px;background:var(--slot);border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;cursor:pointer}
.slot .hint{opacity:.45;font-size:13px}
.slot.full{border-style:solid;background:var(--card)}
.slot.ok{border-color:var(--ok);background:rgba(47,179,109,.15)}
.slot.bad{border-color:var(--bad);background:rgba(229,72,77,.15)}
.pool{margin:26px 0;padding-top:18px;border-top:1px solid var(--slot);min-height:56px}
.chip{background:var(--card);border:0;border-radius:22px;padding:11px 16px;font-size:16px;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--card);color:var(--text)}
#msg{margin-top:14px;font-weight:600;min-height:22px}
</style>
</head>
<body>
<h1>Word Order Trainer</h1>
<div class="tabs" id="tabs"></div>
<div class="formula" id="formula"></div>
<div class="ru" id="ru"></div>
<div class="slots" id="slots"></div>
<div class="pool" id="pool"></div>
<div class="row">
  <button class="btn sec" id="reset">Сначала</button>
  <button class="btn" id="check">Проверить</button>
  <button class="btn sec" id="next">Дальше</button>
</div>
<div id="msg"></div>

<script>
/* === ВСЕ ПРЕДЛОЖЕНИЯ ЗДЕСЬ. Формат: ["Подпись слота","слово"] === */
let TENSES = {
  "Present Simple": {
    formula: "Подлежащее + V (he/she/it: V+s) + объект + время",
    verbHint: "Глагол (V / V+s)",
    items: [
      {ru:"Он читает книгу каждый день.", s:[["Кто","He"],["Глагол","reads"],["Объект","a book"],["Время","every day"]]},
      {ru:"Мы играем в футбол по субботам.", s:[["Кто","We"],["Глагол","play"],["Объект","football"],["Время","on Saturdays"]]},
      {ru:"Она пьёт чай по утрам.", s:[["Кто","She"],["Глагол","drinks"],["Объект","tea"],["Время","in the morning"]]}
    ]},
  "Past Simple": {
    formula: "Подлежащее + V2 (прошедшая форма) + объект + время",
    verbHint: "Глагол (V2)",
    items: [
      {ru:"Она посмотрела фильм вчера.", s:[["Кто","She"],["Глагол","watched"],["Объект","a film"],["Время","yesterday"]]},
      {ru:"Они купили машину в прошлом году.", s:[["Кто","They"],["Глагол","bought"],["Объект","a car"],["Время","last year"]]},
      {ru:"Я написал письмо два дня назад.", s:[["Кто","I"],["Глагол","wrote"],["Объект","a letter"],["Время","two days ago"]]}
    ]},
  "Present Continuous": {
    formula: "Подлежащее + am/is/are + V-ing + объект + время",
    verbHint: "Глагол (be + V-ing)",
    items: [
      {ru:"Они сейчас едят пиццу.", s:[["Кто","They"],["Глагол","are eating"],["Объект","pizza"],["Время","now"]]},
      {ru:"Он сейчас пишет письмо.", s:[["Кто","He"],["Глагол","is writing"],["Объект","a letter"],["Время","right now"]]},
      {ru:"Я сейчас слушаю музыку.", s:[["Кто","I"],["Глагол","am listening to"],["Объект","music"],["Время","at the moment"]]}
    ]}
};

let tense = Object.keys(TENSES)[0], idx = 0, cards = [], placed = [], checked = false;
const $ = id => document.getElementById(id);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function load(){
  const T = TENSES[tense], it = T.items[idx];
  cards = shuffle(it.s.map((x,i)=>({id:i,w:x[1]})));
  placed = it.s.map(()=>null);
  checked = false;
  $("ru").textContent = it.ru;
  $("formula").textContent = T.formula;
  $("msg").textContent = "";
  render();
}

function render(){
  const T = TENSES[tense], it = T.items[idx];
  $("tabs").innerHTML = "";
  Object.keys(TENSES).forEach(k=>{
    const b = document.createElement("button");
    b.className = "tab" + (k===tense?" on":""); b.textContent = k;
    b.onclick = ()=>{tense=k; idx=0; load()};
    $("tabs").appendChild(b);
  });
  $("slots").innerHTML = "";
  it.s.forEach((x,i)=>{
    const d = document.createElement("div");
    const cid = placed[i];
    d.className = "slot" + (cid!==null?" full":"");
    if(checked && cid!==null) d.classList.add(cards.find(c=>c.id===cid).w===x[1] ? "ok":"bad");
    const label = x[0]==="Глагол" ? T.verbHint : x[0];
    d.innerHTML = cid!==null ? cards.find(c=>c.id===cid).w : '<span class="hint">['+label+']</span>';
    d.onclick = ()=>{ if(cid!==null){placed[i]=null; checked=false; $("msg").textContent=""; render()} };
    $("slots").appendChild(d);
  });
  $("pool").innerHTML = "";
  cards.filter(c=>!placed.includes(c.id)).forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c.w;
    b.onclick = ()=>{ const e = placed.indexOf(null); if(e>-1){placed[e]=c.id; checked=false; render()} };
    $("pool").appendChild(b);
  });
}

$("check").onclick = ()=>{
  const it = TENSES[tense].items[idx];
  if(placed.includes(null)){ $("msg").textContent = "Сначала заполните все облачка"; return; }
  checked = true; render();
  const ok = it.s.every((x,i)=>cards.find(c=>c.id===placed[i]).w===x[1]);
  $("msg").textContent = ok ? "Верно! 🎉" : "Есть ошибки — нажмите на красное облачко и поправьте";
  $("msg").style.color = ok ? "var(--ok)" : "var(--bad)";
};
$("reset").onclick = load;
$("next").onclick = ()=>{ idx = (idx+1) % TENSES[tense].items.length; load(); };

/* === ПОДКЛЮЧЕНИЕ К GOOGLE ТАБЛИЦЕ === */
const SHEET_ID = "18hRynBav9ZPhf89rDeHemR-TN51pzQ_owgAXA7pCR6o";
const url = n => "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+n;

function parseCSV(t){
  const rows=[]; let r=[], c="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch==='"') q=true;
    else if(ch===','){ r.push(c); c="" }
    else if(ch==='\n'){ r.push(c); rows.push(r); r=[]; c="" }
    else if(ch!=='\r') c+=ch;
  }
  if(c!==""||r.length){ r.push(c); rows.push(r) }
  return rows;
}

async function loadSheet(){
  try{
    const [a,b] = await Promise.all([fetch(url("Tenses")).then(r=>r.text()), fetch(url("Sentences")).then(r=>r.text())]);
    const T = {};
    parseCSV(a).slice(1).forEach(r=>{ const k=(r[0]||"").trim(); if(k) T[k]={formula:r[1]||"",verbHint:r[2]||"Глагол",items:[]} });
    parseCSV(b).slice(1).forEach(r=>{
      const k=(r[0]||"").trim(); if(!k||!r[1]) return;
      if(!T[k]) T[k]={formula:"",verbHint:"Глагол",items:[]};
      const s=[];
      for(let i=2;i+1<r.length;i+=2){ const w=(r[i+1]||"").trim(); if(w) s.push([(r[i]||"").trim(),w]) }
      if(s.length) T[k].items.push({ru:r[1].trim(),s});
    });
    Object.keys(T).forEach(k=>{ if(!T[k].items.length) delete T[k] });
    if(!Object.keys(T).length) throw new Error("empty");
    TENSES = T; tense = Object.keys(T)[0]; idx = 0;
  }catch(e){
    console.warn("Таблица недоступна, используются встроенные примеры", e);
  }
  load();
}
$("msg").textContent = "Загружаю предложения…";
loadSheet();
</script>
</body>
</html>
